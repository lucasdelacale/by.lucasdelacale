        type: string
      - name: relatedWorks
        label: Obras relacionadas
        type: string
        list: true
        description: Slug do arquivo da obra.
      - name: relatedReferences
        label: Referências relacionadas
        type: string
        list: true
        description: Slug do arquivo da referência.
      - name: body
        label: Texto
        type: rich-text
