        type: string
        required: true
      - name: publishedAt
        label: Data de publicação
        type: date
      - name: year
        label: Ano
        type: number
      - name: type
        label: Tipo
        type: string
        readonly: true
        default: fotografia
      - name: series
        label: Série
        type: reference
        options:
          collection: series
          value: "{name}"
          label: "{primary}"
      - name: coverImage
        label: Imagem principal
        type: image
        required: true
        options:
