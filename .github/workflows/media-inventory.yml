name: Update media inventory

on:
  push:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'src/content/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate inventory
        run: npm run inventory:media

      - name: Commit inventory when changed
        shell: bash
        run: |
          if git diff --quiet -- src/data/media-inventory.json; then
            echo "Inventário já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/media-inventory.json
          git commit -m "chore: update media inventory [skip ci]"
          git push
